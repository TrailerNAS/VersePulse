name: Build VersePulse

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./src/VersePulse/VersePulse.App/VersePulse.App.csproj

      - name: Build
        run: dotnet build ./src/VersePulse/VersePulse.App/VersePulse.App.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./src/VersePulse/VersePulse.App/VersePulse.App.csproj --configuration Release --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VersePulse
          path: publish/